name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install pinned toolchain
        run: |
          rustup toolchain install 1.88.0 \
            --profile minimal \
            --component clippy \
            --component rustfmt \
            --target wasm32-unknown-unknown
      - name: Format
        run: cargo fmt --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Native smoke
        run: cargo run -p realtime-manim-native-preview -- smoke --strict --width 640 --height 360
      - name: Wasm smoke
        run: cargo check -p realtime-manim-web-preview --target wasm32-unknown-unknown
      - name: Wasm clippy
        run: cargo clippy -p realtime-manim-web-preview --target wasm32-unknown-unknown -- -D warnings
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Build distributable browser package
        run: npm run build:package
      - name: Web server and package tests
        run: |
          npm run check:web
          npm run test:web
          npm run test:package
      - name: Documentation site
        run: |
          npm ci --prefix site
          npm test --prefix site
      - name: Rendered browser package test
        run: |
          python3 -m http.server 8921 --bind 127.0.0.1 > "${RUNNER_TEMP}/manim-package-http.log" 2>&1 &
          package_server_pid=$!
          trap 'kill "${package_server_pid}" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8921/packages/manim-web/test/browser.html > /dev/null && break
            sleep 0.25
          done
          npm run test:browser-package
      - name: Sanitized environment capture
        run: cargo run -p realtime-manim-env-capture > "${RUNNER_TEMP}/environment.json"
