<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Package lifecycle test</title></head>
  <body>
    <div id="viewport">Unrelated element with the legacy runtime id</div>
    <canvas id="first" width="640" height="360"></canvas>
    <canvas id="second" width="640" height="360"></canvas>
    <canvas id="third" width="640" height="360"></canvas>
    <canvas id="fourth" width="640" height="360"></canvas>
    <canvas id="bidi-mixed" width="640" height="360"></canvas>
    <canvas id="bidi-joined" width="640" height="360"></canvas>
    <canvas id="bidi-markup-same" width="640" height="360"></canvas>
    <canvas id="bidi-markup-colored" width="640" height="360"></canvas>
    <canvas id="bidi-rtl-spans" width="640" height="360"></canvas>
    <canvas id="bidi-isolated" width="640" height="360"></canvas>
    <canvas id="unsupported-emoji" width="640" height="360"></canvas>
    <script type="module">
      import {
        Arc, Axes, Circle, Create, DotCloud, Group, MarkupText, Path, Path3D, Polygon, Scene,
        Text, createManimPlayer, pathCommand, pathCommand3D,
      } from "../src/index.js";

      const makeScene = (color) => {
        const circle = new Circle({ radius: 1.5 }).fill(color).stroke("#ffffffff", 0.08);
        return new Scene({ background: "#070910" }).add(circle).play(Create(circle, { duration: 0.25 }));
      };

      const makeGeometryScene = () => {
        const axes = new Axes({ id: "axes", xRange: [-3, 3, 1], yRange: [-2, 2, 1] });
        const graph = axes.plot((x) => Math.sin(x), [-3, 3], { id: "function-graph", samples: 121 });
        return new Scene({ background: "#070910" }).add(
          new Group([
            new Polygon([[-2, -1], [0, 2], [2, -1]], { id: "polygon" }).fill("#58c4dd88"),
            new Arc({ id: "arc", radius: 2.5, angle: Math.PI }).stroke("#ffffffff", 0.08),
          ], { id: "geometry" }),
          new MarkupText([{ text: "Rust", weight: "bold", color: "#58c4ddff" }], { id: "rich" }),
          new DotCloud([[-1, -2], [0, -2], [1, -2]], { id: "dots" }),
          new Path3D([
            pathCommand3D.moveTo([0, 0, 0]),
            pathCommand3D.lineTo([1, 1, 1]),
          ], { id: "path-3d" }),
          new Path([
            pathCommand.moveTo([-3, -2.5]),
            pathCommand.lineTo([0, -1.8]),
            pathCommand.lineTo([3, -2.5]),
          ], { id: "dashed-path" }).stroke("#fc6255ff", 0.16).strokeCap("round").strokeJoin("bevel").dash([0.45, 0.2, 0.1], -0.1),
          axes,
          graph,
        ).setCamera3D({ position: [0, 0, 8], target: [0, 0, 0] });
      };

      const testFont = Uint8Array.from(
        atob(globalThis.__MANIM_TEST_FONT_BASE64__ ?? ""),
        (character) => character.charCodeAt(0),
      );
      const makeFontScene = () => new Scene({ background: "#070910" })
        .add(new MarkupText(
          [{ text: "Uploaded OpenType", weight: "bold", color: "#58c4ddff" }],
          { id: "uploaded-font", fontFamily: "Uploaded Sans", fontSize: 1.2 },
        ));

      try {
        const first = await createManimPlayer({
          canvas: document.querySelector("#first"),
          scene: makeFontScene(),
          fonts: [{ family: "Uploaded Sans", data: testFont, weight: "bold" }],
        });
        const fontPreloadWorks = first.diagnostics().registeredFontFaces === 1;
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        const validatedGeometry = first.validate(makeGeometryScene());
        const geometryValid = validatedGeometry.nodes.some(({ type }) => type === "path3d")
          && validatedGeometry.nodes.some(({ type }) => type === "markupText")
          && validatedGeometry.nodes.some(({ id, style }) => id === "dashed-path" && style.strokeCap === "round" && style.dashArray.length === 3)
          && validatedGeometry.nodes.some(({ id, type }) => id === "function-graph" && type === "path");
        first.load(makeGeometryScene());
        first.seek(0.2);
        first.destroy();
        let disposedGuard = false;
        try { first.play(); } catch { disposedGuard = true; }

        const second = await createManimPlayer({ canvas: document.querySelector("#second"), scene: makeScene("#fc6255ff") });
        second.seek(0.2);
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        second.destroy();

        const empty = await createManimPlayer({ canvas: document.querySelector("#second"), autoplay: false });
        const emptyDefaultWorks = empty.validate({
          version: 2, title: "Empty", width: 16, height: 9, duration: 0.25, fps: 60,
          background: "#000000", nodes: [{ id: "root", type: "group" }],
          tracks: [], signals: [], bindings: [], controls: [], audio: [], captions: [],
        }).nodes.length === 1;
        let missingFontRejected = false;
        try {
          empty.load(new Scene().add(new MarkupText(
            [{ text: "Missing" }],
            { fontFamily: "Never Registered" },
          )));
        } catch (error) {
          missingFontRejected = /unregistered font family/.test(String(error));
        }
        let unsupportedMarkupEmojiRejected = false;
        try {
          empty.load(new Scene().add(new MarkupText(
            [{ text: "vector" }, { text: "😀" }],
            { id: "unsupported-markup-emoji" },
          )));
        } catch (error) {
          unsupportedMarkupEmojiRejected = /Markup shaping failed for unsupported-markup-emoji/.test(String(error))
            && /U\+1F600/.test(String(error));
        }
        empty.destroy();

        const concurrent = await Promise.all([
          createManimPlayer({ canvas: document.querySelector("#third"), scene: makeScene("#83c167ff"), autoplay: false }),
          createManimPlayer({ canvas: document.querySelector("#fourth"), scene: makeScene("#ffff00ff"), autoplay: false }),
        ]);
        const [third, fourth] = concurrent;
        third.seek(0.05);
        fourth.seek(0.2);
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        const independentTimes = Math.abs(third.time() - 0.05) < 0.01 && Math.abs(fourth.time() - 0.2) < 0.01;
        third.destroy();
        const survivorWorks = Math.abs(fourth.time() - 0.2) < 0.01;
        fourth.destroy();

        const mixedDirectionScene = new Scene({ background: "#070910" }).add(
          new Text("English — שלום — سلام — 123", { id: "mixed-direction", fontSize: 1.05 })
            .fill("#f4f7ffff")
            .moveTo(0, 1.3),
          new Text("שלום", { id: "hebrew", fontSize: 1.35 })
            .fill("#83c167ff")
            .moveTo(0, -0.2),
          new Text("سَلَام", { id: "arabic-with-marks", fontSize: 1.35 })
            .fill("#58c4ddff")
            .moveTo(0, -1.8),
        );
        const joinedArabicScene = new Scene({ background: "#070910" }).add(
          new Text("سلام", { id: "joined-arabic", fontSize: 2 }).fill("#58c4ddff"),
        );
        const sameStyleMarkupArabicScene = new Scene({ background: "#070910" }).add(
          new MarkupText(
            [..."سلام"].map((text) => ({ text, color: "#58c4ddff" })),
            { id: "same-style-markup-arabic", fontSize: 2 },
          ).fill("#58c4ddff"),
        );
        const coloredMarkupArabicScene = new Scene({ background: "#070910" }).add(
          new MarkupText(
            [..."سلام"].map((text, index) => ({
              text,
              color: index % 2 === 0 ? "#fc6255ff" : "#58c4ddff",
            })),
            { id: "colored-markup-arabic", fontSize: 2 },
          ).fill("#ffffffff"),
        );
        const rtlSpanScene = new Scene({ background: "#070910" }).add(
          new MarkupText(
            [
              { text: "א", color: "#fc6255ff" },
              { text: "ב", color: "#83c167ff" },
              { text: "ג", color: "#58c4ddff" },
            ],
            { id: "rtl-colored-spans", fontSize: 2 },
          ).fill("#ffffffff"),
        );
        const isolatedArabicScene = new Scene({ background: "#070910" }).add(
          ...[..."سلام"].map((text, index) => new Text(text, {
            id: `isolated-arabic-${index}`,
            fontSize: 2,
          }).fill("#58c4ddff").moveTo(-2.1 + index * 1.4, 0)),
        );
        const bidiPlayers = await Promise.all([
          createManimPlayer({ canvas: document.querySelector("#bidi-mixed"), scene: mixedDirectionScene, autoplay: false }),
          createManimPlayer({ canvas: document.querySelector("#bidi-joined"), scene: joinedArabicScene, autoplay: false }),
          createManimPlayer({ canvas: document.querySelector("#bidi-markup-same"), scene: sameStyleMarkupArabicScene, autoplay: false }),
          createManimPlayer({ canvas: document.querySelector("#bidi-markup-colored"), scene: coloredMarkupArabicScene, autoplay: false }),
          createManimPlayer({ canvas: document.querySelector("#bidi-rtl-spans"), scene: rtlSpanScene, autoplay: false }),
          createManimPlayer({ canvas: document.querySelector("#bidi-isolated"), scene: isolatedArabicScene, autoplay: false }),
        ]);
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(() => requestAnimationFrame(resolve))));
        const bidiRenderingWorks = bidiPlayers.every((player) => player.diagnostics().webgpu === true);

        let unsupportedEmojiRejected = false;
        let unsupportedEmojiError = "";
        try {
          await createManimPlayer({
            canvas: document.querySelector("#unsupported-emoji"),
            scene: new Scene({ background: "#070910" }).add(
              new Text("😀", { id: "unsupported-emoji", fontSize: 2 }).fill("#ffffffff"),
            ),
            autoplay: false,
          });
        } catch (error) {
          unsupportedEmojiError = String(error);
          unsupportedEmojiRejected = /Text shaping failed for unsupported-emoji/.test(unsupportedEmojiError)
            && /U\+1F600/.test(unsupportedEmojiError)
            && /No registered vector font covers/.test(unsupportedEmojiError);
        }
        bidiPlayers.forEach((player) => player.destroy());
        globalThis.__MANIM_BROWSER_TEST__ = {
          ok: disposedGuard && geometryValid && fontPreloadWorks && missingFontRejected && emptyDefaultWorks
            && unsupportedMarkupEmojiRejected && independentTimes && survivorWorks
            && bidiRenderingWorks && unsupportedEmojiRejected,
          disposedGuard,
          geometryValid,
          fontPreloadWorks,
          missingFontRejected,
          unsupportedMarkupEmojiRejected,
          emptyDefaultWorks,
          concurrentPlayers: concurrent.length,
          independentTimes,
          survivorWorks,
          bidiPlayers: bidiPlayers.length,
          bidiRenderingWorks,
          unsupportedEmojiRejected,
          unsupportedEmojiError,
        };
      } catch (error) {
        globalThis.__MANIM_BROWSER_TEST__ = { ok: false, error: error?.stack ?? String(error) };
      }
    </script>
  </body>
</html>
