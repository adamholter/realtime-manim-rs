<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>realtime-manim 0.3 public CDN smoke</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; background: #080b12; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #status { position: fixed; left: 12px; bottom: 10px; color: #9fb1cc; font: 12px/1.4 system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <canvas id="manim" width="1280" height="720"></canvas>
    <output id="status">loading public package…</output>
    <script type="module">
      import {
        Arrow,
        Circle,
        Create,
        MoveTo,
        Rectangle,
        Rotate,
        Scene,
        Text,
        createManimPlayer,
      } from "https://cdn.jsdelivr.net/npm/realtime-manim@0.3.0/src/index.js";

      const status = document.querySelector("#status");
      try {
        const orbit = new Circle({ radius: 2.35 })
          .fill("#00000000")
          .stroke("#405071", 0.05);
        const dot = new Circle({ radius: 0.42 })
          .fill("#58c4ddff")
          .stroke("#ffffffff", 0.05)
          .moveTo(-3.3, -0.4);
        const card = new Rectangle({ width: 5.6, height: 1.4, cornerRadius: 0.16 })
          .fill("#18233bff")
          .stroke("#7a8fb8ff", 0.04)
          .moveTo(0, -2.75);
        const arrow = new Arrow([-2.4, 0], [2.4, 0], { tipSize: 0.28 })
          .stroke("#a6e3a1ff", 0.07);
        const label = new Text("realtime-manim 0.3.0", { fontSize: 0.72 })
          .fill("#ffffffff")
          .moveTo(0, 2.8);

        const scene = new Scene({
          title: "Public CDN release smoke",
          background: "#080b12",
          duration: 3,
        })
          .add(orbit, card, arrow, label, dot)
          .play(
            Create(orbit, { duration: 1.1 }),
            Create(arrow, { duration: 1.1 }),
            MoveTo(dot, [3.3, -0.4], { from: [-3.3, -0.4], duration: 2.4 }),
            Rotate(card, Math.PI / 18, { duration: 2.4 }),
          );

        const player = await createManimPlayer({
          canvas: document.querySelector("#manim"),
          scene,
          autoplay: false,
        });
        player.seek(1.65);
        status.textContent = "public npm + CDN + Rust/Wasm/WebGPU: ready";
        globalThis.__realtimeManimPublicPlayer = player;
        globalThis.__realtimeManimPublicReady = true;
      } catch (error) {
        status.textContent = error?.stack ?? String(error);
        globalThis.__realtimeManimPublicError = error?.stack ?? String(error);
        throw error;
      }
    </script>
  </body>
</html>
